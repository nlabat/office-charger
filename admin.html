<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Charger System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen">
        <div class="login-container">
            <h1>🔒 Admin Panel</h1>
            <p>Admin access only</p>
            <input type="email" id="email" placeholder="Admin email" />
            <input type="password" id="password" placeholder="Password" />
            <button id="login-btn">Sign In</button>
            <p id="auth-error" class="error"></p>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="admin-dashboard" style="display:none;">
        <header>
            <h1>🔒 Admin Panel</h1>
            <div class="header-right">
                <a href="index.html" class="back-link">← Back to Dashboard</a>
                <span id="user-email"></span>
                <button id="logout-btn">Logout</button>
            </div>
        </header>

        <!-- Admin Stats -->
        <div class="stats-bar">
            <div class="stat">
                <span class="stat-number" id="available-count">0</span>
                <span class="stat-label">Available</span>
            </div>
            <div class="stat">
                <span class="stat-number" id="in-use-count">0</span>
                <span class="stat-label">In Use</span>
            </div>
            <div class="stat">
                <span class="stat-number" id="out-of-order-count">0</span>
                <span class="stat-label">Out of Order</span>
            </div>
            <div class="stat">
                <span class="stat-number" id="queue-count">0</span>
                <span class="stat-label">In Queue</span>
            </div>
            <div class="stat">
                <span class="stat-number" id="total-users-count">0</span>
                <span class="stat-label">Total Users</span>
            </div>
        </div>

        <!-- Admin Tabs -->
        <div class="admin-tabs">
            <button class="tab-btn active" onclick="showTab('chargers')">⚡ Chargers</button>
            <button class="tab-btn" onclick="showTab('queue')">📋 Queue</button>
            <button class="tab-btn" onclick="showTab('history')">📊 History</button>
            <button class="tab-btn" onclick="showTab('settings')">⚙️ Settings</button>
        </div>

        <!-- Chargers Tab -->
        <div id="tab-chargers" class="tab-content active">
            <div class="admin-actions">
                <button class="action-btn danger" onclick="resetAllChargers()">🔄 Reset All Chargers</button>
            </div>
            <div class="admin-charger-grid" id="admin-charger-grid">
                <!-- Rendered by JS -->
            </div>
        </div>

        <!-- Queue Tab -->
        <div id="tab-queue" class="tab-content">
            <div class="admin-actions">
                <button class="action-btn danger" onclick="clearQueue()">🗑️ Clear Entire Queue</button>
            </div>
            <div id="admin-queue-list">
                <!-- Rendered by JS -->
            </div>
        </div>

        <!-- History Tab -->
        <div id="tab-history" class="tab-content">
            <div class="admin-actions">
                <button class="action-btn" onclick="exportHistory()">📥 Export CSV</button>
                <button class="action-btn danger" onclick="clearHistory()">🗑️ Clear History</button>
            </div>
            <div class="history-filters">
                <input type="date" id="history-date" />
                <button onclick="filterHistory()">Filter</button>
            </div>
            <table class="history-table">
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Charger</th>
                        <th>Start Time</th>
                        <th>End Time</th>
                        <th>Duration</th>
                    </tr>
                </thead>
                <tbody id="history-tbody">
                </tbody>
            </table>
        </div>

        <!-- Settings Tab -->
        <div id="tab-settings" class="tab-content">
            <div class="settings-section">
                <h3>⏱️ Session Settings</h3>
                <div class="setting-item">
                    <label>Max charging time (hours):</label>
                    <input type="number" id="max-hours" value="3" min="1" max="12" />
                    <button onclick="saveMaxHours()">Save</button>
                </div>
            </div>

            <div class="settings-section">
                <h3>📝 Rename Chargers</h3>
                <div id="rename-chargers-list">
                    <!-- Rendered by JS -->
                </div>
                <button class="action-btn" onclick="saveChargerNames()">💾 Save All Names</button>
            </div>

            <div class="settings-section">
                <h3>👑 Admin Users</h3>
                <div class="setting-item">
                    <input type="email" id="new-admin-email" placeholder="Email to make admin" />
                    <button onclick="addAdmin()">Add Admin</button>
                </div>
                <div id="admin-list">
                    <!-- Rendered by JS -->
                </div>
            </div>
        </div>
        <div class="header-right">
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    <span id="user-email"></span>
    <button id="change-password-btn" onclick="openChangePassword()">🔑</button>
    <button id="logout-btn">Logout</button>
</div>
        
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="admin.js"></script>
</body>
</html>
